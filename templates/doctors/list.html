{% extends "base.html" %}

{% block content %}
<h1>Врачи</h1>

<ul>
{% for doctor in doctors %}
    <li>
        <b>{{ doctor[2] }}</b> — {{ doctor[3] }}
        <form method="post" action="/appointments/create" style="margin-top:5px">
            <input type="hidden" name="doctor_id" value="{{ doctor[0] }}">
            <input type="datetime-local" name="time" required>
            <button type="submit">Записаться</button>
        </form>
    </li>
{% endfor %}
</ul>


{% endblock %}
